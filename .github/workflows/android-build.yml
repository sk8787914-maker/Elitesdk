name: Android Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.4

      - name: Build library
        run: gradle clean assemble --stacktrace

      - name: Upload AAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elitesdk-aar-${{ github.run_number }}
          path: |
            build/outputs/aar/*.aar
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release with AAR
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aar-v${{ github.run_number }}
          name: EliteSDK AAR Release ${{ github.run_number }}
          body: |
            Automated release build from GitHub Actions (auto-release on push to main)
            - Target: Android 16 (API 36)
            - ABIs: arm64-v8a, armeabi-v7a
            - AuthCore: GMS + Facebook + Twitter/X login fix (Android 16+ safe)
          files: |
            build/outputs/aar/*release*.aar
            build/outputs/aar/*debug*.aar
          make_latest: true
